<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b45"><link rel="manifest" href="manifest.json"><title>Nyumba Arusha</title><style>
:root{--g:#0b6b45;--dark:#063b2a;--bg:#f4f7f6;--card:#fff;--muted:#68756f;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#16221d}header{background:linear-gradient(135deg,var(--g),var(--dark));color:white;padding:18px 16px;position:sticky;top:0;z-index:4}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;background:#fff;color:var(--g);border-radius:14px;display:grid;place-items:center;font-size:28px}.brand h1{margin:0}.brand small{opacity:.85}main{max-width:900px;margin:auto;padding:14px 14px 85px}.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #163b2b12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.house img{width:100%;height:180px;object-fit:cover;border-radius:12px}.price{font-size:19px;font-weight:800;color:var(--g)}input,select,textarea{width:100%;padding:12px;border:1px solid #d3ddd8;border-radius:10px;margin:5px 0;font-size:15px;background:#fff}button{border:0;border-radius:10px;padding:12px 14px;background:var(--g);color:#fff;font-weight:700;cursor:pointer;margin:5px 0;width:100%}button.alt{background:#e8efeb;color:#124c38}button.red{background:var(--red)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{display:inline-block;background:#e7f4ed;padding:5px 8px;border-radius:999px;font-size:12px;margin:2px}.muted{color:var(--muted)}.hidden{display:none!important}.notice{background:#fff6d8;border-radius:12px;padding:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:8px;display:flex;gap:8px;z-index:5}.nav button{margin:0}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat>div{background:#eef6f2;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.contact{background:#e9f8f0;padding:12px;border-radius:12px}.small{font-size:13px}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style></head><body><header><div class="brand"><div class="logo">🏠</div><div><h1>Nyumba Arusha</h1><small>Tafuta nyumba kwa urahisi</small></div></div></header><main>
<section id="home"><div class="card"><h3>Tafuta nyumba</h3><div class="row"><input id="q" placeholder="Njiro, 2 bedroom..."><select id="area"><option value="">Maeneo yote</option><option>Njiro</option><option>Sanawari</option><option>Unga Limited</option><option>Olasiti</option></select></div><button onclick="loadHouses()">🔎 Tafuta</button></div><div class="notice">🔐 Mawasiliano ya mwenye nyumba yanafunguliwa baada ya malipo ya <b id="feeText">Tsh 2,000</b> kuthibitishwa.</div><div id="list" class="grid"></div></section>
<section id="account" class="hidden"><div class="card"><h2>👤 Akaunti</h2><div id="accountInfo"></div><button class="red" onclick="logout()">Toka</button><button class="alt" onclick="deleteAccount()">Futa akaunti yangu</button></div></section>
<section id="login" class="hidden"><div class="card"><h2>Ingia / Jisajili</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (angalau herufi 8)"><div class="row"><button onclick="login(false)">Ingia</button><button class="alt" onclick="login(true)">Jisajili</button></div><p id="authMsg"></p></div></section>
<section id="admin" class="hidden"><div class="card"><h2>👨‍💼 Admin Dashboard</h2><div class="stat"><div><b id="st1">0</b>Nyumba</div><div><b id="st2">0</b>Malipo</div><div><b id="st3">0</b>Tsh</div></div></div><div class="card"><h3>⚙️ Payment settings</h3><div class="row"><input id="airtel" placeholder="Airtel Money"><input id="mpesa" placeholder="M-Pesa"></div><input id="fee" type="number" placeholder="Access fee"><select id="provider"><option value="manual">Manual / webhook</option><option value="selcom">Selcom</option></select><button onclick="saveSettings()">Hifadhi</button></div><div class="card"><h3>➕ Ongeza nyumba</h3><input id="title" placeholder="Jina la nyumba"><div class="row"><input id="ha" value="Njiro" placeholder="Eneo"><input id="hp" type="number" placeholder="Kodi kwa mwezi"></div><div class="row"><input id="rooms" type="number" placeholder="Vyumba"><input id="bathrooms" type="number" placeholder="Bafu"></div><input id="owner" placeholder="Jina la mwenye nyumba"><div class="row"><input id="phone" placeholder="Simu"><input id="wa" placeholder="WhatsApp"></div><input id="address" placeholder="Maelezo ya eneo (si address kamili)"><textarea id="desc" placeholder="Maelezo"></textarea><input id="amenities" placeholder="Mfano: parking, maji, fence"><input id="photo" type="file" accept="image/*"><button onclick="addHouse()">📤 Hifadhi tangazo</button></div><div class="card"><h3>Matangazo</h3><div id="adminList"></div></div><div class="card"><h3>Malipo</h3><div id="payments"></div></div></section>
</main><div class="nav"><button onclick="show('home')">🏠 Nyumba</button><button onclick="show('account')">👤 Akaunti</button><button id="adminBtn" class="hidden" onclick="show('admin')">⚙️ Admin</button></div>
<script>
const API=localStorage.getItem('apiBase')||'http://localhost:8080/api';let token=localStorage.getItem('token')||'';let me=JSON.parse(localStorage.getItem('me')||'null');let settings={access_fee:2000,airtel_number:'0695659623',mpesa_number:'0758965884'};
const $=id=>document.getElementById(id);async function api(path,opt={}){opt.headers=opt.headers||{};if(token)opt.headers.Authorization='Bearer '+token;let r=await fetch(API+path,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(d.error||'Request failed'),{data:d,status:r.status});return d}
function show(id){['home','account','login','admin'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');if(id==='home')loadHouses();if(id==='account')account();if(id==='admin')loadAdmin();}
async function init(){try{settings=await api('/settings');$('feeText').textContent='Tsh '+Number(settings.access_fee).toLocaleString()}catch{}if(me){$('adminBtn').classList.toggle('hidden',me.role!=='ADMIN')}loadHouses()}
async function loadHouses(){try{let p=new URLSearchParams();if($('q').value)p.set('q',$('q').value);if($('area').value)p.set('area',$('area').value);let rows=await api('/properties?'+p);$('list').innerHTML=rows.length?rows.map(h=>`<div class="card house">${h.image_url?`<img src="${h.image_url}">`:''}<h3>${esc(h.title)}</h3><span class="pill">📍 ${esc(h.area)}</span><span class="pill">🛏 ${h.rooms||'-'} vyumba</span><p class="price">Tsh ${Number(h.monthly_rent).toLocaleString()}/mwezi</p><p>${esc(h.description||'')}</p><button onclick="unlock('${h.id}')">🔒 Lipa Tsh ${Number(settings.access_fee||2000).toLocaleString()} kuona contact</button></div>`).join(''):'<div class="card">Hakuna nyumba iliyopatikana.</div>'}catch(e){$('list').innerHTML='<div class="card">API haijapatikana. Weka backend ianze kisha refresh.</div>'}}
async function unlock(id){if(!token){show('login');return}try{let c=await api('/properties/'+id+'/contact');return contact(c)}catch(e){if(e.status!==402)return alert(e.message)}try{let d=await api('/payments/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({property_id:id,payer_phone:prompt('Weka namba yako ya simu (hiari)')||''})});alert(`Lipa Tsh ${Number(d.instructions.fee).toLocaleString()}\nAirtel: ${d.instructions.airtel_number}\nM-Pesa: ${d.instructions.mpesa_number}\nReference: ${d.instructions.reference}\n\nBaada ya payment provider kuthibitisha, contact itafunguka.`);setTimeout(async()=>{try{contact(await api('/properties/'+id+'/contact'))}catch{}},2500)}catch(e){alert(e.message)}}
function contact(c){alert(`Mwenye nyumba: ${c.landlord_name||''}\nSimu: ${c.phone}\nWhatsApp: ${c.whatsapp||c.phone}`)}
async function login(register){try{let d=await api('/auth/'+(register?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.token;me=d.user;localStorage.setItem('token',token);localStorage.setItem('me',JSON.stringify(me));$('adminBtn').classList.toggle('hidden',me.role!=='ADMIN');show(me.role==='ADMIN'?'admin':'home')}catch(e){$('authMsg').textContent='❌ '+e.message}}
function logout(){token='';me=null;localStorage.removeItem('token');localStorage.removeItem('me');$('adminBtn').classList.add('hidden');show('home')}
async function deleteAccount(){if(!confirm('Futa akaunti na data zake?'))return;try{await api('/auth/delete',{method:'DELETE'});logout();alert('Akaunti imefutwa.')}catch(e){alert(e.message)}}
function account(){$('accountInfo').innerHTML=me?`<p><b>${esc(me.email)}</b></p><p class="muted">Role: ${esc(me.role)}</p>`:'<p>Hujaingia. <button onclick="show(\'login\')">Ingia</button></p>'}
async function loadAdmin(){if(!me||me.role!=='ADMIN')return show('login');try{let [s,rows,pay,stats]=await Promise.all([api('/settings'),api('/admin/properties'),api('/admin/payments'),api('/admin/stats')]);settings=s;$('airtel').value=s.airtel_number;$('mpesa').value=s.mpesa_number;$('fee').value=s.access_fee;$('provider').value=s.payment_provider;$('st1').textContent=stats.properties;$('st2').textContent=stats.payments;$('st3').textContent=Number(stats.revenue).toLocaleString();$('adminList').innerHTML=rows.map(h=>`<div class="card"><b>${esc(h.title)}</b><br>📍 ${esc(h.area)} • Tsh ${Number(h.monthly_rent).toLocaleString()}<br><button class="red" onclick="hideHouse('${h.id}')">Ficha</button></div>`).join('')||'Hakuna';$('payments').innerHTML=pay.map(p=>`<div class="card small"><b>${esc(p.provider_reference)}</b><br>Tsh ${Number(p.amount).toLocaleString()} • ${p.status}<br>${esc(p.email||'')}</div>`).join('')||'Hakuna'}catch(e){alert(e.message)}}
async function saveSettings(){try{await api('/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_fee:Number($('fee').value),airtel_number:$('airtel').value,mpesa_number:$('mpesa').value,payment_provider:$('provider').value})});alert('Settings zimehifadhiwa')}catch(e){alert(e.message)}}
async function addHouse(){let f=$('photo').files[0],fd=new FormData();[['title','title'],['ha','area'],['hp','monthly_rent'],['rooms','rooms'],['bathrooms','bathrooms'],['owner','landlord_name'],['phone','phone'],['wa','whatsapp'],['address','address_hint'],['desc','description']].forEach(([a,b])=>fd.append(b,$(a).value));fd.append('amenities',JSON.stringify($('amenities').value.split(',').map(x=>x.trim()).filter(Boolean)));if(f)fd.append('image',f);try{await api('/admin/properties',{method:'POST',body:fd});alert('Tangazo limehifadhiwa');loadAdmin();loadHouses()}catch(e){alert(e.message)}}
async function hideHouse(id){if(!confirm('Ficha tangazo?'))return;try{await api('/admin/properties/'+id,{method:'DELETE'});loadAdmin();loadHouses()}catch(e){alert(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});init();
</script></body></html>
